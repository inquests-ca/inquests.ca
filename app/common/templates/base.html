<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Inquests.ca{% endblock %}</title>
    <style>
        :root {
            --accent-red: #d6006d;
            --accent-blue: #3f51b5;
            --ink: #1a1a1a;
            --text-muted: #6b6b6b;
            --border: #e2e2e2;
            --bg: #ffffff;
            --bg-subtle: #fafafa;
            --bg-page: #f9f9f9;
            --radius: 4px;
            --radius-box: 6px;
            --shadow: 0 2px 5px rgba(0, 0, 0, 0.2), 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background: var(--bg-page);
            color: var(--ink);
            font-size: 15px;
        }

        a { color: inherit; }

        /* ---- site header ---- */

        header.site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 2rem;
            background: var(--bg);
            box-shadow: var(--shadow);
            position: relative;
            z-index: 1;
        }

        .brand {
            font-size: 1.4rem;
            font-weight: 300;
            text-decoration: none;
            color: var(--ink);
            letter-spacing: -0.01em;
        }

        .brand .dot-ca { color: inherit; }

        nav.site-nav {
            display: flex;
            align-items: center;
            gap: 1.75rem;
        }

        nav.site-nav a.nav-link {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-muted);
        }

        nav.site-nav a.nav-link:hover { color: var(--ink); }

        .btn-login {
            display: inline-block;
            border: 1px solid var(--ink);
            border-radius: 999px;
            padding: 0.45rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            color: var(--ink);
        }

        .btn-login:hover { background: var(--ink); color: #fff; }

        .logout-form { display: inline-block; margin: 0; }

        button.btn-login {
            background: none;
            cursor: pointer;
            font-family: inherit;
        }

        /* ---- layout ---- */

        .layout {
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
            padding: 1.75rem 2rem;
        }

        aside.sidebar {
            width: 17rem;
            flex: none;
            padding: 1.75rem 1.5rem;
            background: var(--bg);
            border-radius: var(--radius-box);
            box-shadow: var(--shadow);
        }

        main.content {
            flex: 1;
            min-width: 0;
        }

        .results-box {
            background: var(--bg);
            border-radius: var(--radius-box);
            box-shadow: var(--shadow);
            padding: 0.5rem 1.75rem 1.5rem;
        }

        /* ---- sidebar: type toggle ---- */

        .type-toggle {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            margin-bottom: 1.75rem;
        }

        .type-toggle a {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            text-decoration: none;
            color: var(--ink);
            font-size: 1.05rem;
        }

        .type-toggle .dot {
            width: 1.05rem;
            height: 1.05rem;
            border-radius: 50%;
            border: 2px solid #b5b5b5;
            flex: none;
        }

        .type-toggle a.active .dot {
            border-color: var(--accent-red);
            background: radial-gradient(circle, var(--accent-red) 42%, transparent 46%);
        }

        .type-toggle a.active { font-weight: 600; }

        /* ---- sidebar: search form ---- */

        .search-form .field {
            margin-bottom: 1.5rem;
        }

        .search-form label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .search-form input[type="text"],
        .search-form input[type="password"],
        .search-form input[type="date"],
        .search-form input[type="number"],
        .search-form textarea,
        .search-form select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.55rem 0.7rem;
            font-size: 0.9rem;
            background: var(--bg);
            color: var(--ink);
            font-family: inherit;
        }

        .search-form textarea { resize: vertical; }

        .search-form select[multiple] {
            padding: 0.35rem;
        }

        .search-form option {
            padding: 0.3rem 0.4rem;
        }

        .search-form input[type="text"]:focus,
        .search-form input[type="password"]:focus,
        .search-form input[type="date"]:focus,
        .search-form input[type="number"]:focus,
        .search-form textarea:focus,
        .search-form select:focus {
            outline: none;
            border-color: #b5b5b5;
            box-shadow: 0 0 0 3px var(--bg-subtle);
        }

        .field-errors, .errorlist {
            display: block;
            list-style: none;
            color: var(--accent-red);
            font-size: 0.82rem;
            margin: 0.4rem 0 0;
            padding: 0;
        }

        .field-checkbox label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0;
        }

        .field-checkbox input[type="checkbox"] { width: auto; }

        /* ---- multiselect (autocomplete) ---- */

        select.multiselect-native { display: none; }

        .multiselect-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.5rem;
        }

        .multiselect-chips:empty { display: none; }

        .multiselect-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .multiselect-chip-remove {
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.95rem;
            line-height: 1;
            color: var(--text-muted);
            padding: 0;
        }

        .multiselect-chip-remove:hover { color: var(--ink); }

        .multiselect-input-wrap { position: relative; }

        .multiselect-dropdown {
            position: absolute;
            z-index: 10;
            top: calc(100% + 0.25rem);
            left: 0;
            right: 0;
            max-height: 14rem;
            overflow-y: auto;
            margin: 0;
            padding: 0.3rem;
            list-style: none;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .multiselect-option {
            padding: 0.45rem 0.6rem;
            border-radius: var(--radius);
            font-size: 0.88rem;
            cursor: pointer;
        }

        .multiselect-option:hover, .multiselect-option.is-active {
            background: var(--bg-subtle);
        }

        /* ---- sidebar: advanced search ---- */

        details.advanced-search {
            border-top: 1px solid var(--border);
            padding-top: 1rem;
            margin-bottom: 1.5rem;
        }

        details.advanced-search summary {
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        details.advanced-search summary:hover { color: var(--ink); }

        details.advanced-search summary::-webkit-details-marker { display: none; }

        details.advanced-search summary::after {
            content: '+';
            font-size: 1rem;
            line-height: 1;
        }

        details.advanced-search[open] summary::after { content: '\2212'; }

        details.advanced-search summary { margin-bottom: 0; }

        details.advanced-search[open] summary { margin-bottom: 1.25rem; }

        details.advanced-search .field:last-child { margin-bottom: 0; }

        /* ---- login page ---- */

        .login-layout {
            display: flex;
            justify-content: center;
            padding: 3.5rem 2rem;
        }

        .login-box {
            width: 100%;
            max-width: 22rem;
            background: var(--bg);
            border-radius: var(--radius-box);
            box-shadow: var(--shadow);
            padding: 2rem 1.75rem;
        }

        .login-box h1 {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 0 0 1.5rem;
        }

        .btn {
            display: inline-block;
            width: 100%;
            border: none;
            border-radius: var(--radius);
            padding: 0.65rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            cursor: pointer;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            color: var(--ink);
            text-align: center;
            text-decoration: none;
        }

        .btn:hover { background: #f0f0f0; }

        .btn-primary {
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            color: var(--ink);
        }

        .btn-inline { width: auto; }

        .btn-edit {
            width: auto;
            flex: none;
            padding: 0.5rem 1.1rem;
        }

        .edit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
            gap: 0 1.5rem;
        }

        .edit-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .edit-actions .btn-delete { margin-left: auto; }

        .search-form .actions {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }

        /* ---- content header ---- */

        .content-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        .content-header h1 {
            font-size: 1.5rem;
            font-weight: 300;
        }

        /* ---- results table ---- */

        table {
            border-collapse: collapse;
            width: 100%;
        }

        .results-table thead th {
            text-align: left;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            padding: 0.6rem 0.75rem;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .results-table thead th a {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: inherit;
            text-decoration: none;
        }

        .results-table thead th a:hover { color: var(--ink); }

        .sort-arrow { font-size: 0.7em; }

        .results-table tbody td {
            padding: 0.85rem 0.75rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            vertical-align: top;
        }

        .results-table tbody tr:last-child td { border-bottom: none; }

        .results-table { table-layout: fixed; }

        .col-overview {
            max-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        tbody td {
            padding: 1.1rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            vertical-align: top;
        }

        tbody tr:first-child td { border-top: 1px solid var(--border); }

        .result-name {
            display: block;
            color: var(--accent-blue);
            font-size: 1.05rem;
            text-decoration: none;
            margin-bottom: 0.3rem;
        }

        .results-table .result-name {
            display: inline;
            font-size: inherit;
            font-weight: 600;
            margin-bottom: 0;
        }

        .result-name:hover { text-decoration: underline; }

        .cell-strong {
            font-weight: 600;
        }

        .result-meta {
            color: var(--ink);
            font-size: 0.88rem;
            line-height: 1.6;
        }

        .result-meta .muted { color: var(--text-muted); }

        .key-case-cell {
            width: 7rem;
            text-align: right;
            white-space: nowrap;
        }

        .key-case-tag {
            color: var(--accent-red);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 3rem 1rem !important;
        }

        /* ---- pagination ---- */

        .pagination {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .pagination a, .pagination span.disabled {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .pagination a { color: var(--ink); }
        .pagination a:hover { border-color: var(--ink); background: var(--bg-subtle); }
        .pagination span.disabled { color: #c7c7c7; }

        .page-numbers {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .page-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1.9rem;
            height: 1.9rem;
            padding: 0 0.4rem;
            border-radius: var(--radius);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--ink);
        }

        a.page-number:hover { background: var(--bg-subtle); }
        .page-number.current { background: var(--ink); color: var(--bg); }
        .page-ellipsis { color: var(--text-muted); padding: 0 0.15rem; }

        /* ---- detail page ---- */

        .detail-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            padding-top: 1.25rem;
        }

        .detail-header h1 {
            font-size: 1.35rem;
            font-weight: 600;
            margin: 0;
        }

        .detail-heading {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .detail-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0.35rem 0 0;
        }

        .detail-section {
            padding: 1.5rem 0;
            border-top: 1px solid var(--border);
        }

        .detail-section:first-of-type {
            border-top: none;
            padding-top: 1rem;
        }

        .detail-section h2 {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 0 0 0.85rem;
        }

        .detail-section p {
            margin: 0 0 0.75rem;
            line-height: 1.6;
            font-size: 0.92rem;
        }

        .detail-section p:last-child { margin-bottom: 0; }

        .detail-facts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr));
            gap: 1.1rem 1.5rem;
            margin: 0;
        }

        .detail-facts dt {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .detail-facts dd {
            margin: 0;
            font-size: 0.92rem;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            display: inline-block;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.25rem 0.75rem;
            font-size: 0.8rem;
            color: var(--ink);
        }

        a.tag {
            text-decoration: none;
        }

        a.tag:hover {
            border-color: var(--ink);
            background: #f0f0f0;
        }

        .detail-section table tbody tr:first-child td { border-top: none; }

        @media (max-width: 48rem) {
            .layout { flex-direction: column; }
            aside.sidebar { width: 100%; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <a href="{% url 'inquest-list' %}" class="brand">Inquests<span class="dot-ca">.ca</span></a>
        <nav class="site-nav">
            <a href="#" class="nav-link">Terms of Use</a>
            <a href="#" class="nav-link">Help</a>
            {% if user.is_authenticated %}
            <span class="nav-link">{{ user.get_username }}</span>
            <form method="post" action="{% url 'logout' %}" class="logout-form">
                {% csrf_token %}
                <button type="submit" class="btn-login">Log Out</button>
            </form>
            {% else %}
            <a href="{% url 'login' %}?next={{ request.path }}" class="btn-login">Log In</a>
            {% endif %}
        </nav>
    </header>

    {% block layout %}
    <div class="layout">
        <aside class="sidebar">
            <div class="type-toggle">
                <a href="{% url 'authority-list' %}" class="{% if active_tab == 'authorities' %}active{% endif %}">
                    <span class="dot"></span> Authorities
                </a>
                <a href="{% url 'inquest-list' %}" class="{% if active_tab == 'inquests' %}active{% endif %}">
                    <span class="dot"></span> Inquests
                </a>
            </div>

            {% block sidebar %}{% endblock %}
        </aside>

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% endblock %}

    <script>
        (function () {
            var instanceCount = 0;

            function enhance(select) {
                instanceCount += 1;
                var listboxId = 'multiselect-listbox-' + instanceCount;

                var wrapper = document.createElement('div');
                wrapper.className = 'multiselect';

                var chips = document.createElement('div');
                chips.className = 'multiselect-chips';

                var input = document.createElement('input');
                input.type = 'text';
                input.className = 'multiselect-input';
                input.placeholder = 'Type to search…';
                input.autocomplete = 'off';
                input.setAttribute('role', 'combobox');
                input.setAttribute('aria-expanded', 'false');
                input.setAttribute('aria-autocomplete', 'list');
                input.setAttribute('aria-controls', listboxId);
                if (select.id) {
                    input.id = select.id;
                    select.removeAttribute('id');
                }

                var dropdown = document.createElement('ul');
                dropdown.id = listboxId;
                dropdown.className = 'multiselect-dropdown';
                dropdown.setAttribute('role', 'listbox');
                dropdown.hidden = true;

                var inputWrap = document.createElement('div');
                inputWrap.className = 'multiselect-input-wrap';
                inputWrap.appendChild(input);
                inputWrap.appendChild(dropdown);

                wrapper.appendChild(chips);
                wrapper.appendChild(inputWrap);

                select.classList.add('multiselect-native');
                select.insertAdjacentElement('afterend', wrapper);

                var activeIndex = -1;
                var currentMatches = [];

                function optionList() {
                    return Array.prototype.slice.call(select.options);
                }

                function renderChips() {
                    chips.innerHTML = '';
                    optionList().filter(function (o) { return o.selected; }).forEach(function (o) {
                        var chip = document.createElement('span');
                        chip.className = 'tag multiselect-chip';
                        chip.textContent = o.textContent;

                        var remove = document.createElement('button');
                        remove.type = 'button';
                        remove.className = 'multiselect-chip-remove';
                        remove.setAttribute('aria-label', 'Remove ' + o.textContent);
                        remove.textContent = '×';
                        remove.addEventListener('click', function () {
                            o.selected = false;
                            renderChips();
                            renderDropdown();
                        });

                        chip.appendChild(remove);
                        chips.appendChild(chip);
                    });
                }

                function setActive(index) {
                    var items = dropdown.querySelectorAll('.multiselect-option');
                    items.forEach(function (item) { item.classList.remove('is-active'); });
                    activeIndex = index;
                    if (index >= 0 && index < items.length) {
                        items[index].classList.add('is-active');
                        items[index].scrollIntoView({ block: 'nearest' });
                        input.setAttribute('aria-activedescendant', items[index].id);
                    } else {
                        input.removeAttribute('aria-activedescendant');
                    }
                }

                function selectOption(o) {
                    o.selected = true;
                    input.value = '';
                    renderChips();
                    renderDropdown();
                    input.focus();
                }

                function renderDropdown() {
                    var query = input.value.trim().toLowerCase();
                    dropdown.innerHTML = '';
                    activeIndex = -1;
                    input.removeAttribute('aria-activedescendant');
                    currentMatches = optionList().filter(function (o) {
                        return !o.selected && (!query || o.textContent.toLowerCase().indexOf(query) !== -1);
                    }).slice(0, 50);

                    if (!currentMatches.length) {
                        dropdown.hidden = true;
                        input.setAttribute('aria-expanded', 'false');
                        return;
                    }

                    currentMatches.forEach(function (o, index) {
                        var item = document.createElement('li');
                        item.id = listboxId + '-option-' + index;
                        item.className = 'multiselect-option';
                        item.setAttribute('role', 'option');
                        item.textContent = o.textContent;
                        item.addEventListener('mousedown', function (e) {
                            e.preventDefault();
                            selectOption(o);
                        });
                        dropdown.appendChild(item);
                    });
                    dropdown.hidden = false;
                    input.setAttribute('aria-expanded', 'true');
                }

                input.addEventListener('input', renderDropdown);
                input.addEventListener('focus', renderDropdown);
                input.addEventListener('blur', function () {
                    window.setTimeout(function () {
                        dropdown.hidden = true;
                        input.setAttribute('aria-expanded', 'false');
                    }, 100);
                });
                input.addEventListener('keydown', function (e) {
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        if (dropdown.hidden) { renderDropdown(); }
                        setActive(Math.min(activeIndex + 1, currentMatches.length - 1));
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        setActive(Math.max(activeIndex - 1, 0));
                    } else if (e.key === 'Enter') {
                        if (!dropdown.hidden && activeIndex >= 0 && currentMatches[activeIndex]) {
                            e.preventDefault();
                            selectOption(currentMatches[activeIndex]);
                        }
                    } else if (e.key === 'Escape') {
                        dropdown.hidden = true;
                        input.setAttribute('aria-expanded', 'false');
                    } else if (e.key === 'Backspace' && !input.value) {
                        var selected = optionList().filter(function (o) { return o.selected; });
                        var last = selected[selected.length - 1];
                        if (last) {
                            last.selected = false;
                            renderChips();
                            renderDropdown();
                        }
                    }
                });

                renderChips();
            }

            document.addEventListener('DOMContentLoaded', function () {
                document.querySelectorAll('select.js-multiselect').forEach(enhance);
            });
        })();
    </script>
</body>
</html>
