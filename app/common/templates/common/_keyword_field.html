<div class="field">
    <label for="keywords">Keywords</label>
    <select id="keywords" name="keywords" multiple size="6" class="js-multiselect">
        {% for keyword in keywords %}
        <option value="{{ keyword.id }}" {% if keyword.id in selected_keyword_ids %}selected{% endif %}>{{ keyword.label }}</option>
        {% endfor %}
    </select>
</div>
